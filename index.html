<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Store Link POS System</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dynamic Background Elements -->
    <div class="bg-shape circle-1"></div>
    <div class="bg-shape circle-2"></div>

    <!-- Login Screen -->
    <div id="login-screen" class="glass-card login-box">
        <div class="brand-logo">
            <i class="fa-solid fa-cash-register"></i>
        </div>
        <h2>Store Link POS</h2>
        <p class="subtitle">Enter your credentials to continue</p>

        <div class="input-group">
            <i class="fa-solid fa-user input-icon"></i>
            <input type="text" id="username" placeholder="Username" autocomplete="off">
        </div>
        
        <div class="input-group">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="Password">
        </div>

        <button class="btn-primary" onclick="handleLogin()">
            <span>Login</span>
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

    <!-- Main Application -->
    <div id="main-app" style="display: none;">
        
        <!-- Header & Navigation -->
        <header class="app-header glass-card">
            <div class="brand-info">
                <i class="fa-solid fa-store"></i>
                <h2>Store Link POS</h2>
            </div>

            <nav class="glass-nav">
                <button class="nav-btn active" onclick="showTab('pos-tab', this)">
                    <i class="fa-solid fa-cart-shopping"></i> <span>POS</span>
                </button>
                <button id="nav-inventory" class="nav-btn" onclick="showTab('inventory-tab', this)">
                    <i class="fa-solid fa-boxes-stacked"></i> <span>Inventory</span>
                </button>
                <button class="nav-btn" onclick="showTab('history-tab', this)">
                    <i class="fa-solid fa-receipt"></i> <span>Sales History</span>
                </button>
                <button class="nav-btn" onclick="showTab('settings-tab', this)">
                    <i class="fa-solid fa-gear"></i> <span>Settings</span>
                </button>
            </nav>

            <div class="user-meta">
                <div class="user-badge">
                    <i class="fa-solid fa-circle-user"></i>
                    <span id="current-user-display"></span>
                </div>
                <button class="btn-logout" onclick="handleLogout()" title="Logout">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="content-area">
            
            <!-- POS Section -->
            <div id="pos-tab" class="tab-content active">
                <div class="pos-layout">
                    <!-- Products Grid -->
                    <div class="products-container">
                        <div class="section-header glass-card">
                            <h3><i class="fa-solid fa-box-open"></i> Available Products</h3>
                        </div>
                        <div class="products-section" id="product-list">
                            <!-- Products rendered here -->
                        </div>
                    </div>
                    
                    <!-- Cart Section -->
                    <div class="cart-section glass-card">
                        <div class="cart-header">
                            <h3><i class="fa-solid fa-cart-flatbed"></i> Shopping Cart</h3>
                        </div>
                        
                        <div id="cart-items" class="cart-items-wrapper"></div>
                        
                        <div class="cart-summary">
                            <div class="input-group">
                                <i class="fa-solid fa-mobile-screen input-icon"></i>
                                <input type="text" id="customer-phone" placeholder="Customer Phone (For 2% Discount)">
                            </div>
                            
                            <div class="cart-total-details">
                                <div class="total-row">
                                    <span>Subtotal</span>
                                    <span>৳<span id="subtotal">0</span></span>
                                </div>
                                <div class="total-row discount-row">
                                    <span>Discount</span>
                                    <span>- ৳<span id="discount">0</span></span>
                                </div>
                                <div class="total-row grand-total">
                                    <span>Total Amount</span>
                                    <span>৳<span id="total-amount">0</span></span>
                                </div>
                            </div>

                            <button class="checkout-btn" onclick="processCheckout()">
                                <i class="fa-solid fa-print"></i> Checkout & Print
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Inventory Section -->
            <div id="inventory-tab" class="tab-content">
                <div class="inventory-grid">
                    <div class="glass-card form-card">
                        <h3><i class="fa-solid fa-folder-plus"></i> Add / Update Product</h3>
                        <div class="input-group">
                            <i class="fa-solid fa-barcode input-icon"></i>
                            <input type="text" id="prod-sku" placeholder="SKU Number">
                        </div>
                        <div class="input-group">
                            <i class="fa-solid fa-tag input-icon"></i>
                            <input type="text" id="prod-name" placeholder="Product Name">
                        </div>
                        <div class="input-group">
                            <i class="fa-solid fa-bangladeshi-taka-sign input-icon"></i>
                            <input type="number" id="prod-price" placeholder="Price (BDT)">
                        </div>
                        <div class="input-group">
                            <i class="fa-solid fa-cubes input-icon"></i>
                            <input type="number" id="prod-stock" placeholder="Stock Quantity">
                        </div>
                        <button class="btn-primary" onclick="addProduct()">
                            <i class="fa-solid fa-floppy-disk"></i> Save Product
                        </button>
                    </div>

                    <div class="inventory-display">
                        <div class="section-header glass-card">
                            <h3><i class="fa-solid fa-warehouse"></i> Inventory Stock</h3>
                        </div>
                        <div class="inventory-list" id="inventory-list"></div>
                    </div>
                </div>
            </div>

            <!-- Sales History Section -->
            <div id="history-tab" class="tab-content">
                <div class="section-header glass-card">
                    <h3><i class="fa-solid fa-clock-rotate-left"></i> Transaction History</h3>
                </div>
                <div id="sales-history-list" class="history-grid"></div>
            </div>

            <!-- Settings Section -->
            <div id="settings-tab" class="tab-content">
                <div id="settings-content" class="glass-card settings-card">
                    <!-- Dynamic content based on role -->
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
