<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Link POS System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen" class="neomorphic-container">
        <h2>Store Link POS System</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password ">
        <button onclick="handleLogin()">Login</button>
    </div>

    <!-- Main Application -->
    <div id="main-app" style="display: none;">
        
        <!-- Navigation -->
        <nav class="neomorphic-nav">
            <button onclick="showTab('pos-tab')">POS</button>
            <button id="nav-inventory" onclick="showTab('inventory-tab')">Inventory</button>
            <button onclick="showTab('history-tab')">Sales History</button>
            <button onclick="showTab('settings-tab')">Settings</button>
            <button onclick="handleLogout()" style="color: rgb(255, 2, 2);">Logout</button>
        </nav>

        <!-- Current User Info -->
        <div class="user-info">
            Logged in as: <span id="current-user-display"></span>
        </div>

        <div class="content-area">
            <!-- POS Section -->
            <div id="pos-tab" class="tab-content active">
                <div class="pos-layout">
                    <!-- Products Grid -->
                    <div class="products-section" id="product-list">
                        <!-- Products will be rendered here -->
                    </div>
                    
                    <!-- Cart Section -->
                    <div class="cart-section neomorphic-card">
                        <h3>Shopping Cart</h3>
                        <div id="cart-items"></div>
                        <hr>
                        <input type="text" id="customer-phone" placeholder="Customer Phone (For 2% Discount)">
                        <div class="cart-total">
                            <p>Subtotal: ৳<span id="subtotal">0</span></p>
                            <p>Discount: ৳<span id="discount">0</span></p>
                            <h4>Total: ৳<span id="total-amount">0</span></h4>
                        </div>
                        <button class="checkout-btn" onclick="processCheckout()">Checkout & Print</button>
                    </div>
                </div>
            </div>

            <!-- Inventory Section -->
            <div id="inventory-tab" class="tab-content">
                <div class="neomorphic-card">
                    <h3>Add/Update Product</h3>
                    <input type="text" id="prod-sku" placeholder="SKU">
                    <input type="text" id="prod-name" placeholder="Product Name">
                    <input type="number" id="prod-price" placeholder="Price">
                    <input type="number" id="prod-stock" placeholder="Stock Quantity">
                    <button onclick="addProduct()">Save Product</button>
                </div>
                <div class="inventory-list" id="inventory-list"></div>
            </div>

            <!-- Sales History Section -->
            <div id="history-tab" class="tab-content">
                <h2>Sales History</h2>
                <div id="sales-history-list"></div>
            </div>

            <!-- Settings Section -->
            <div id="settings-tab" class="tab-content">
                <div id="settings-content" class="neomorphic-card">
                    <!-- Dynamic content based on role -->
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
